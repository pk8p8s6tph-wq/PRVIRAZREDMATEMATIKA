<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dino Oduzimanje</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#EF9A9A;font-family:-apple-system,Arial;display:flex;justify-content:center;overflow:hidden}
#game{width:375px;max-width:100vw;height:100dvh;background:white;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px;position:relative}
#top{display:flex;justify-content:space-between;background:#FFF9C4;padding:10px 14px;border-radius:12px;font-weight:bold;font-size:18px}
#dinoArea{text-align:center;height:155px;padding-top:5px}
#dinoSvg{width:130px;height:130px}
#ime{font-weight:900;font-size:17px;letter-spacing:1px;margin-top:2px}
#pitanje{font-size:56px;font-weight:900;text-align:center;margin:10px 0;color:#222}
#odgovori{display:grid;gap:11px;margin-top:auto;padding-bottom:10px}
.odgovor{padding:18px;font-size:34px;font-weight:800;border-radius:16px;border:3px solid #C62828;background:#FFEBEE}
.odgovor:active{transform:scale(0.96);background:#C62828;color:white}
#nagrada{text-align:center;font-size:28px;min-height:42px;font-weight:900}
#confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.skok{animation:skok .6s} @keyframes skok{50%{transform:translateY(-28px) scale(1.25)}}
</style>
</head>
<body>
<div id="game">
<canvas id="confetti"></canvas>
<div id="top"><span id="bod">⭐ 0</span><span id="jaja">🥚 0</span></div>
<div id="dinoArea"><div id="dinoHolder"></div><div id="ime">T-REX</div></div>
<div id="nagrada"></div>
<div id="pitanje"></div>
<div id="odgovori"></div>
</div>
<script>
const dinos=[
{name:"T-REX",color:"#2E7D32",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><circle cx="50" cy="62" r="28" fill="#4CAF50"/><circle cx="50" cy="35" r="19" fill="#66BB6A"/><circle cx="42" cy="31" r="5" fill="white"/><circle cx="58" cy="31" r="5" fill="white"/><circle cx="42" cy="32" r="2" fill="black"/><circle cx="58" cy="32" r="2" fill="black"/><path d="M40 44 Q50 50 60 44" stroke="black" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`},
{name:"BRONTO",color:"#1565C0",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><ellipse cx="50" cy="70" rx="30" ry="20" fill="#42A5F5"/><circle cx="50" cy="33" r="18" fill="#90CAF9"/><circle cx="43" cy="31" r="4" fill="white"/><circle cx="57" cy="31" r="4" fill="white"/><circle cx="43" cy="32" r="1.5" fill="black"/><circle cx="57" cy="32" r="1.5" fill="black"/><path d="M15 68 Q5 60 18 50" fill="#42A5F5" stroke="#1565C0" stroke-width="2"/></svg>`},
{name:"TRICE",color:"#6A1B9A",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><circle cx="50" cy="65" r="27" fill="#AB47BC"/><circle cx="50" cy="38" r="20" fill="#CE93D8"/><circle cx="30" cy="28" r="4" fill="#E1BEE7"/><circle cx="70" cy="28" r="4" fill="#E1BEE7"/><circle cx="50" cy="20" r="3" fill="#E1BEE7"/><circle cx="42" cy="36" r="5" fill="white"/><circle cx="58" cy="36" r="5" fill="white"/><circle cx="42" cy="37" r="2" fill="black"/><circle cx="58" cy="37" r="2" fill="black"/></svg>`},
{name:"STEGO",color:"#EF6C00",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="28" ry="18" fill="#FFA726"/><circle cx="50" cy="38" r="18" fill="#FFCC80"/><path d="M38 18 L42 28 L34 28 Z" fill="#EF6C00"/><path d="M52 14 L57 26 L47 26 Z" fill="#EF6C00"/><path d="M66 18 L70 28 L62 28 Z" fill="#EF6C00"/><circle cx="43" cy="36" r="4" fill="white"/><circle cx="57" cy="36" r="4" fill="white"/><circle cx="43" cy="37" r="1.5" fill="black"/><circle cx="57" cy="37" r="1.5" fill="black"/></svg>`},
{name:"PTERO",color:"#00838F",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><circle cx="50" cy="55" r="20" fill="#26C6DA"/><path d="M8 50 Q22 32 38 50 Q22 56 8 50" fill="#4DD0E1"/><path d="M92 50 Q78 32 62 50 Q78 56 92 50" fill="#4DD0E1"/><circle cx="50" cy="38" r="14" fill="#80DEEA"/><circle cx="44" cy="36" r="3" fill="white"/><circle cx="56" cy="36" r="3" fill="white"/><circle cx="44" cy="37" r="1.2" fill="black"/><circle cx="56" cy="37" r="1.2" fill="black"/></svg>`}
];
let idx=0,bod=0,jaja=0,aCtx;
const conf=document.getElementById('confetti'); const cCtx=conf.getContext('2d');
function resize(){conf.width=375; conf.height=window.innerHeight;} resize();
function muzika(){
 try{
  if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();
  let t=aCtx.currentTime;
  [523,659,784,1046,784,1046].forEach((f,i)=>{let o=aCtx.createOscillator(),g=aCtx.createGain();o.connect(g);g.connect(aCtx.destination);o.frequency.value=f;g.gain.setValueAtTime(.28,t+i*.11);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.45);o.start(t+i*.11);o.stop(t+i*.11+.45);});
 }catch(e){}
}
function konfete(){
 let parts=[]; for(let i=0;i<140;i++) parts.push({x:187,y:220,vx:(Math.random()-0.5)*10,vy:Math.random()*-12-3,r:Math.random()*5+3,c:`hsl(${Math.random()*360},100%,50%)`,life:110});
 let id=setInterval(()=>{cCtx.clearRect(0,0,conf.width,conf.height); parts.forEach(p=>{p.x+=p.vx; p.vy+=0.28; p.y+=p.vy; p.life--; cCtx.fillStyle=p.c; cCtx.fillRect(p.x,p.y,p.r,p.r);}); parts=parts.filter(p=>p.life>0&&p.y<900); if(!parts.length) clearInterval(id);},16);
}
function postavi(i){document.getElementById('dinoHolder').innerHTML=dinos[i].svg; document.getElementById('ime').innerText=dinos[i].name; document.getElementById('ime').style.color=dinos[i].color;}
function novo(){
 let a=Math.floor(Math.random()*10)+1;
 let b=Math.floor(Math.random()*a)+1;
 let t=a-b;
 document.getElementById('pitanje').innerText=`${a} - ${b} = ?`;
 let op=[t]; while(op.length<3){let r=Math.floor(Math.random()*11); if(!op.includes(r)) op.push(r);} op.sort(()=>Math.random()-.5);
 document.getElementById('odgovori').innerHTML=op.map(o=>`<button class="odgovor" onclick="check(${o},${t})">${o}</button>`).join('');
}
function check(k,t){
 if(k===t){
  bod++; muzika(); konfete();
  document.getElementById('dinoHolder').firstChild.classList.add('skok');
  document.getElementById('nagrada').innerText='🎉 BRAVO! 🎉';
  if(bod%5==0){jaja++; document.getElementById('nagrada').innerText='🥚 NOVI DINO!';}
  setTimeout(()=>{idx=(idx+1)%dinos.length; postavi(idx); document.getElementById('nagrada').innerText=''; novo();},1100);
 }else{
  document.getElementById('nagrada').innerText='❌ POKUŠAJ OPET';
  setTimeout(()=>document.getElementById('nagrada').innerText='',700);
 }
 document.getElementById('bod').innerText=`⭐ ${bod}`; document.getElementById('jaja').innerText=`🥚 ${jaja}`;
}
postavi(0); novo();
document.body.addEventListener('touchstart',()=>{if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();},{once:true});
</script>
</body>
</html>
