<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DINO MAT">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
<title>DINO MATEMATIKA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#A5D6A7;font-family:-apple-system,Arial;display:flex;justify-content:center;min-height:100dvh}
#app{width:375px;max-width:100vw;background:white;display:flex;flex-direction:column;padding:20px;min-height:100dvh}
h1{text-align:center;font-size:32px;margin:10px 0 5px}.sub{text-align:center;color:#666;font-size:14px;margin-bottom:20px}
.card{display:block;text-decoration:none;padding:22px;border-radius:20px;margin-bottom:16px;border:3px solid;transition:.15s}
.card:active{transform:scale(0.97)}.card h2{margin:0;font-size:26px}.card p{margin:6px 0 0;color:#333;font-size:15px}
.card.sab{background:#E8F5E9;border-color:#2E7D32;color:#2E7D32}.card.oduz{background:#FFEBEE;border-color:#C62828;color:#C62828}
.dinos{text-align:center;font-size:38px;margin:15px 0;letter-spacing:6px}
.badge{text-align:center;background:#FFF9C4;padding:10px;border-radius:12px;font-weight:bold;font-size:13px;margin-top:auto}
#status{font-size:12px;text-align:center;margin-top:10px;color:green}
</style>
</head>
<body>
<div id="app">
<h1>🦖 DINO MATEMATIKA</h1>
<p class="sub">Izaberi igricu - radi offline</p>
<div class="dinos">🦖🦕🦎🐊🦕</div>
<a class="card sab" href="./sabiranje.html"><h2>➕ SABIRANJE do 10</h2><p>5 dinosaurusa • konfete • muzika</p></a>
<a class="card oduz" href="./oduzimanje.html"><h2>➖ ODUZIMANJE do 10</h2><p>Bez negativnih • konfete • muzika</p></a>
<div class="badge">⭐ Svakih 5 tačnih = 🥚 novo jaje</div>
<div id="status">Učitavam offline...</div>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>{document.getElementById('status').innerText='✅ OFFLINE AKTIVAN - dodaj na desktop';});}
</script>
</body>
</html>
