<title>DINO - GIF</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FFCDD2;font-family:-apple-system,Arial;display:flex;justify-content:center;overflow:hidden}
#game{width:375px;max-width:100vw;height:100dvh;background:white;display:flex;flex-direction:column;padding:10px;position:relative}
#top{display:flex;justify-content:space-between;background:#FFF9C4;padding:10px 14px;border-radius:12px;font-weight:bold;font-size:18px}
#dinoArea{text-align:center;height:170px}#dinoSvg{width:140px;height:140px}
#ime{font-weight:900;font-size:17px;margin-top:2px}
#pitanje{font-size:56px;font-weight:900;text-align:center;margin:8px 0}#odgovori{display:grid;gap:11px;margin-top:auto;padding-bottom:10px}
.odgovor{padding:18px;font-size:34px;font-weight:800;border-radius:16px;border:3px solid #C62828;background:#FFEBEE}
.odgovor:active{transform:scale(0.96)}
#nagrada{text-align:center;font-size:27px;min-height:40px;font-weight:900}
#confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.skok{animation:skok .7s ease}@keyframes skok{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-40px) scale(1.4) rotate(-7deg)}60%{transform:translateY(-10px) scale(1.15) rotate(7deg)}100%{transform:translateY(0) scale(1)}}
.tres{animation:tres .4s}@keyframes tres{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.back{display:inline-block;text-decoration:none;background:#eee;padding:6px 12px;border-radius:8px;font-size:13px;color:#333}
/* GIF efekti */
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}} 
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.blink{animation:blink 3s infinite;transform-origin:center}
.float{animation:float 1.2s ease-in-out infinite}
.wag{animation:wag .6s ease-in-out infinite;transform-origin:20% 50%}
</style>
</head>
