<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>DINO - GIF</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FFCDD2;font-family:-apple-system,Arial;display:flex;justify-content:center;overflow:hidden}
#game{width:375px;max-width:100vw;height:100dvh;background:white;display:flex;flex-direction:column;padding:10px;position:relative}
#top{display:flex;justify-content:space-between;background:#FFF9C4;padding:10px 14px;border-radius:12px;font-weight:bold;font-size:18px}
#dinoArea{text-align:center;height:170px}#dinoSvg{width:140px;height:140px}
#ime{font-weight:900;font-size:17px;margin-top:2px}
#pitanje{font-size:56px;font-weight:900;text-align:center;margin:8px 0}#odgovori{display:grid;gap:11px;margin-top:auto;padding-bottom:10px}
.odgovor{padding:18px;font-size:34px;font-weight:800;border-radius:16px;border:3px solid #C62828;background:#FFEBEE}
.odgovor:active{transform:scale(0.96)}
#nagrada{text-align:center;font-size:27px;min-height:40px;font-weight:900}
#confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.skok{animation:skok .7s ease}@keyframes skok{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-40px) scale(1.4) rotate(-7deg)}60%{transform:translateY(-10px) scale(1.15) rotate(7deg)}100%{transform:translateY(0) scale(1)}}
.tres{animation:tres .4s}@keyframes tres{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.back{display:inline-block;text-decoration:none;background:#eee;padding:6px 12px;border-radius:8px;font-size:13px;color:#333}
/* GIF efekti */
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}} 
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.blink{animation:blink 3s infinite;transform-origin:center}
.float{animation:float 1.2s ease-in-out infinite}
.wag{animation:wag .6s ease-in-out infinite;transform-origin:20% 50%}
</style>
</head>
<body>
<div id="game"><canvas id="confetti"></canvas><a class="back" href="./index.html">← Nazad</a>
<div id="top"><span id="bod">⭐ 0</span><span id="jaja">🥚 0</span></div>
<div id="dinoArea"><div id="dinoHolder"></div><div id="ime">T-REX</div></div>
<div id="nagrada"></div><div id="pitanje"></div><div id="odgovori"></div></div>
<script>
const dinos=[
{name:"T-REX",color:"#C62828",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><circle cx="50" cy="62" r="27" fill="#EF9A9A" stroke="#C62828" stroke-width="2"/><circle cx="50" cy="34" r="18" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/><g class="blink"><circle cx="42" cy="30" r="5.5" fill="white" stroke="black" stroke-width="1"/><circle cx="58" cy="30" r="5.5" fill="white" stroke="black" stroke-width="1"/><circle cx="42" cy="31.5" r="2" fill="black"/><circle cx="58" cy="31.5" r="2" fill="black"/></g><path d="M38 42 Q50 50 62 42" stroke="black" fill="none" stroke-width="2.5" stroke-linecap="round"/></g><g class="wag"><path d="M22 60 L16 52 L26 54" fill="#EF9A9A" stroke="#C62828" stroke-width="1.5"/></g></svg>`},
{name:"BRONTO",color:"#1565C0",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="70" rx="29" ry="19" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/><circle cx="52" cy="34" r="17" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/><g class="blink"><circle cx="46" cy="31" r="4" fill="white" stroke="black"/><circle cx="46" cy="32" r="1.2" fill="black"/></g></g><g class="wag"><path d="M12 67 Q4 58 16 48 Q20 55 28 60" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/></g></svg>`},
{name:"TRICE",color:"#6A1B9A",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="66" rx="27" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="2"/><circle cx="50" cy="38" r="20" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="2"/><g class="blink"><circle cx="42" cy="36" r="4" fill="white" stroke="black"/><circle cx="58" cy="36" r="4" fill="white" stroke="black"/></g></g><circle cx="28" cy="27" r="4.5" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.2"><animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="1s" repeatCount="indefinite"/></circle></svg>`},
{name:"STEGO",color:"#EF6C00",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="68" rx="28" ry="18" fill="#FFCC80" stroke="#EF6C00" stroke-width="2"/><circle cx="50" cy="38" r="17" fill="#FFE0B2" stroke="#EF6C00" stroke-width="2"/><g class="blink"><circle cx="44" cy="37" r="3.5" fill="white" stroke="black"/><circle cx="56" cy="37" r="3.5" fill="white" stroke="black"/></g></g><g><path d="M36 18 L40 28 L32 28 Z" fill="#EF6C00"><animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="0.8s" repeatCount="indefinite"/></path></g></svg>`},
{name:"PTERO",color:"#00838F",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><circle cx="50" cy="56" r="18" fill="#80DEEA" stroke="#00838F" stroke-width="2"/><circle cx="50" cy="36" r="13" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/><g class="blink"><circle cx="45" cy="35" r="3" fill="white" stroke="black"/><circle cx="55" cy="35" r="3" fill="white" stroke="black"/></g></g><g class="wag"><path d="M10 52 Q26 34 40 51 Q26 58 10 52" fill="#B2EBF2" stroke="#00838F" stroke-width="1.5"/></g><g class="wag"><path d="M90 52 Q74 34 60 51 Q74 58 90 52" fill="#B2EBF2" stroke="#00838F" stroke-width="1.5"/></g></svg>`},
{name:"RAPTOR",color:"#C62828",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><circle cx="50" cy="60" r="23" fill="#EF5350" stroke="#C62828" stroke-width="2"/><circle cx="50" cy="33" r="16" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/><g class="blink"><circle cx="42" cy="31" r="4" fill="white" stroke="black"/><circle cx="42" cy="32" r="1.5" fill="black"/></g></g></svg>`},
{name:"ANKY",color:"#5D4037",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="68" rx="31" ry="19" fill="#A1887F" stroke="#5D4037" stroke-width="2"/><circle cx="50" cy="40" r="16" fill="#D7CCC8" stroke="#5D4037" stroke-width="2"/><g class="blink"><circle cx="44" cy="38" r="3" fill="white" stroke="black"/></g></g></svg>`},
{name:"DIPLO",color:"#2E7D32",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="72" rx="27" ry="15" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/><circle cx="50" cy="38" r="15" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/></g><g class="wag"><path d="M77 70 Q94 64 88 49 Q80 57 71 62" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/></g></svg>`},
{name:"PARA",color:"#0D47A1",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><circle cx="50" cy="62" r="25" fill="#64B5F6" stroke="#0D47A1" stroke-width="2"/><circle cx="50" cy="36" r="17" fill="#BBDEFB" stroke="#0D47A1" stroke-width="2"/><g class="blink"><circle cx="43" cy="35" r="3.5" fill="white" stroke="black"/><circle cx="57" cy="35" r="3.5" fill="white" stroke="black"/></g></g></svg>`},
{name:"SPINO",color:"#E65100",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="65" rx="25" ry="17" fill="#FFB74D" stroke="#E65100" stroke-width="2"/><circle cx="50" cy="38" r="14" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/><g class="blink"><circle cx="44" cy="37" r="3" fill="white" stroke="black"/></g></g><path d="M34 46 L38 26 L42 46 L46 22 L50 46" fill="#FF6F00" stroke="#E65100" stroke-width="1"><animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="0.6s" repeatCount="indefinite"/></path></svg>`}
];
let idx=0,bod=0,jaja=0,aCtx;const conf=document.getElementById('confetti');const cCtx=conf.getContext('2d');conf.width=375;conf.height=600;
function zvukTacno(){try{if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();let t=aCtx.currentTime;[523,659,784,1046].forEach((f,i)=>{let o=aCtx.createOscillator(),g=aCtx.createGain();o.connect(g);g.connect(aCtx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.28,t+i*.11);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.45);o.start(t+i*.11);o.stop(t+i*.11+.45);});}catch(e){}}
function zvukNetacno(){try{if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();let t=aCtx.currentTime;let o=aCtx.createOscillator(),g=aCtx.createGain();o.connect(g);g.connect(aCtx.destination);o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(70,t+.45);g.gain.setValueAtTime(.4,t);g.gain.linearRampToValueAtTime(0.01,t+.5);o.start(t);o.stop(t+.5);}catch(e){}}
function konfete(){let parts=[];for(let i=0;i<110;i++) parts.push({x:187,y:210,vx:(Math.random()-0.5)*10,vy:Math.random()*-11-3,r:Math.random()*5+3,c:`hsl(${Math.random()*360},100%,50%)`,life:105});let id=setInterval(()=>{cCtx.clearRect(0,0,conf.width,conf.height);parts.forEach(p=>{p.x+=p.vx;p.vy+=0.28;p.y+=p.vy;p.life--;cCtx.fillStyle=p.c;cCtx.fillRect(p.x,p.y,p.r,p.r);});parts=parts.filter(p=>p.life>0&&p.y<900);if(!parts.length) clearInterval(id);},16);}
function postavi(i){document.getElementById('dinoHolder').innerHTML=dinos[i].svg;document.getElementById('ime').innerText=dinos[i].name;document.getElementById('ime').style.color=dinos[i].color;}
function novo(){let a=Math.floor(Math.random()*10)+1;let b=Math.floor(Math.random()*a)+1;let t=a-b;document.getElementById('pitanje').innerText=`${a} - ${b} =?`;let op=[t];while(op.length<3){let r=Math.floor(Math.random()*11);if(!op.includes(r)) op.push(r);}op.sort(()=>Math.random()-.5);document.getElementById('odgovori').innerHTML=op.map(o=>`<button class="odgovor" onclick="check(${o},${t})">${o}</button>`).join('');}
function check(k,t){if(k===t){bod++;zvukTacno();konfete();let d=document.getElementById('dinoHolder');d.classList.remove('skok');void d.offsetWidth;d.classList.add('skok');document.getElementById('nagrada').innerText='🎉 BRAVO! 🎉';if(bod%5==0){jaja++;document.getElementById('nagrada').innerText='🥚 NOVI DINO!';}setTimeout(()=>{idx=(idx+1)%dinos.length;postavi(idx);document.getElementById('nagrada').innerText='';d.classList.remove('skok');novo();},1100);}else{zvukNetacno();if(jaja>0) jaja--;let d=document.getElementById('dinoHolder');d.classList.remove('tres');void d.offsetWidth;d.classList.add('tres');document.getElementById('nagrada').innerText='💔 -1 JAJE!';setTimeout(()=>{document.getElementById('nagrada').innerText='';d.classList.remove('tres');},900);}document.getElementById('bod').innerText=`⭐ ${bod}`;document.getElementById('jaja').innerText=`🥚 ${jaja}`;}
postavi(0);novo();document.body.addEventListener('touchstart',()=>{if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();},{once:true});
</script></body></html>
